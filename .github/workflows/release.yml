name: Publish release

# Builds ShugoTracker.exe (the Python core inside a portable Electron app) and publishes it as a GitHub Release. Runs ONLY when you publish:
#   - Actions tab → "Publish release" → Run workflow → enter a version like 1.2.0, or
#   - push a tag:  git tag v1.2.0 && git push origin v1.2.0
# The in-app updater picks up the newest release automatically.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+(\.\d+)?$') { throw "Version must look like 1.2.0 (got '$v')" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -t .

      - name: Window code parses (a typo here leaves the app unable to open)
        shell: bash
        run: for f in desktop/*.js desktop/renderer/js/*.js; do node --check "$f" || exit 1; done

      - name: Tests passed for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" -q '.total_count')
          if [ "$ok" = "0" ] || [ -z "$ok" ]; then echo "The Tests run for ${{ github.sha }} hasn't passed: not publishing"; exit 1; fi

      - name: Stamp version
        shell: pwsh
        run: |
          Set-Content -Path shugotracker/_version.py -Value "__version__ = `"${{ steps.v.outputs.version }}`""
          $v = "${{ steps.v.outputs.version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "$v.0" }
          Push-Location desktop
          npm version $v --no-git-tag-version --allow-same-version
          Pop-Location

      - name: Build the core (dist/shugo-core)
        run: python -m PyInstaller --noconfirm --clean ShugoCore.spec

      - name: Build ShugoTracker.exe (Electron app inside a one-file launcher)
        shell: pwsh
        run: |
          Push-Location desktop
          npm install --no-audit --no-fund
          Pop-Location
          desktop\build-exe.ps1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "Shugo-Tracker-${{ steps.v.outputs.version }}-Windows"
          Copy-Item desktop\dist\ShugoTracker.exe "out\$name.exe"
          $hash = (Get-FileHash "out\$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Set-Content -NoNewline "out\$name.exe.sha256"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "out\$name.exe", README.md, LICENSE pkg\
          Compress-Archive -Path pkg\* -DestinationPath "out\$name.zip" -Force

      - name: Release notes (this version's section of CHANGES.md)
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $out = @(); $on = $false
          foreach ($l in Get-Content CHANGES.md) {
            if ($l -match '^## ') { $on = ($l.Substring(3).Trim() -eq $v); continue }
            if ($on -and $l.Trim()) { $out += $l }
          }
          if (-not $out) { $out = @("- Fixes and improvements") }
          ($out -join "`n") | Set-Content -NoNewline out\notes.md
          Get-Content out\notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Shugo Tracker v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: out/notes.md
          files: |
            out/Shugo-Tracker-*-Windows.exe
            out/Shugo-Tracker-*-Windows.exe.sha256
            out/Shugo-Tracker-*-Windows.zip

  # The Android app, at the same version, attached to the same release
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.release.outputs.version }}

  # The README's download buttons point straight at this release's files (their names carry the version, so
  # GitHub's "latest/download" links can't reach them)
  readme:
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Point the download links at this release
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          sed -E -i \
            -e "s#${base}/(latest/download|download/v[^/]+)/(ShugoTracker\.exe|Shugo-Tracker-[0-9.]+-Windows\.exe)#${base}/download/v${V}/Shugo-Tracker-${V}-Windows.exe#g" \
            -e "s#${base}/(latest/download|download/v[^/]+)/(ShugoTracker\.apk|Shugo-Tracker-[0-9.]+-Android\.apk)#${base}/download/v${V}/Shugo-Tracker-${V}-Android.apk#g" \
            README.md
          git diff --stat
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "README: download links for v${V}"
          git push -q origin HEAD:main
