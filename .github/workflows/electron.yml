# The Electron app: build it on Windows (Python core + Electron, one portable ShugoTracker.exe), run the tests,
# and take screenshots of the real window in demo mode (pushed to the ci-electron-shots branch).
name: Electron app

on:
  push:
    branches: [electron]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Python tests
        run: python -m unittest discover -s tests -t .
      - name: Build the core (shugo-core.exe)
        run: python -m PyInstaller --noconfirm --clean ShugoCore.spec
      - name: Core answers over stdin / stdout
        shell: pwsh
        run: |
          $out = '{"id":1,"method":"init","params":{}}' + "`n" + '{"method":"quit"}' | .\dist\shugo-core.exe --root $env:RUNNER_TEMP\coretest --demo
          Write-Output "::notice title=core::$(($out | Select-Object -First 1).Substring(0, 120))"
          if (-not ($out -match '"result"')) { exit 1 }
      - name: Install Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.48.2
      - name: Screenshots of the real window (demo data)
        working-directory: desktop
        env:
          PYTHON: python
        run: node test/shots.js
      - name: Build ShugoTracker.exe
        working-directory: desktop
        run: npx electron-builder --win portable --publish never
      - name: Exe icon as Windows shows it, and start-up time
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = (Resolve-Path desktop\dist\ShugoTracker.exe).Path
          [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save("$PWD\shots\exe-icon.png")
          $dir = Join-Path $env:RUNNER_TEMP "portable"
          foreach ($i in 1, 2) {
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $exe $dir
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process (Join-Path $dir "ShugoTracker.exe") -ArgumentList "--demo" -PassThru
            while (-not (Test-Path (Join-Path $dir "logs\shugo-core.log")) -and $sw.Elapsed.TotalSeconds -lt 60) { Start-Sleep -Milliseconds 100 }
            $t = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            Write-Output "::notice title=startup::run $i: backend running after $t s"
            "startup run ${i}: $t s" | Add-Content shots\log.txt
            Get-Process | Where-Object { $_.Path -and ($_.Path -like "*ShugoTracker*" -or $_.Path -like "*shugo-core*") } | Stop-Process -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
      - name: Size
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item desktop\dist\ShugoTracker.exe).Length / 1MB, 1)
          Write-Output "::notice title=exe::ShugoTracker.exe is $mb MB"
          "exe: $mb MB" | Add-Content shots\log.txt
      - name: Publish screenshots to ci-electron-shots
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Set-Location shots
          git init -q -b ci-electron-shots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Electron screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-electron-shots
      - uses: actions/upload-artifact@v4
        with:
          name: ShugoTracker-electron
          path: desktop/dist/ShugoTracker.exe
          if-no-files-found: warn
