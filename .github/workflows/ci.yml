name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Live API check (real search + details through the app's own client)
        shell: pwsh
        run: |
          python -m shugotracker.app --search-cli Luna *> live.txt
          $code = $LASTEXITCODE
          Get-Content live.txt | Select-Object -Last 9 | ForEach-Object { Write-Output "::notice title=live::$_" }
          exit $code

      - name: Loading-speed benchmark (cold vs cached)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m shugotracker.app --bench Luna *> bench.txt
          Copy-Item bench.txt ui-bench.txt
          Get-Content bench.txt | Select-Object -Last 4 | ForEach-Object { Write-Output "::notice title=bench::$_" }

      - name: UI screenshots (demo data)
        shell: pwsh
        run: |
          python -m shugotracker.app --demo --query Luna --screenshot ui-demo.png *> ui-demo-log.txt
          $code = $LASTEXITCODE
          Get-Content ui-demo-log.txt | Select-Object -Last 15 | ForEach-Object { Write-Output "::notice title=demo::$_" }
          exit $code

      - name: UI screenshots (README showcase, one live character)
        continue-on-error: true
        run: python -m shugotracker.app --showcase Cynica@Kaisinel=Claude --query Claude --screenshot ui-show.png

      - name: UI screenshots (live data)
        continue-on-error: true
        run: python -m shugotracker.app --query Luna --screenshot ui-live.png

      - name: Packaged exe keeps favorites (start, star, quit, start again from another folder)
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          Set-Content -Path shugotracker/_version.py -Value '__version__ = "0.0.1"'
          python -m PyInstaller --noconfirm --clean ShugoTracker.spec *> build.txt
          git checkout -- shugotracker/_version.py
          $mb = [math]::Round((Get-Item dist\ShugoTracker.exe).Length / 1MB, 1)
          Write-Output "::notice title=exe::ShugoTracker.exe is $mb MB"
          "exe size: $mb MB" | Set-Content ui-exe-size.txt
          # portable: everything lives next to the exe, and moving the whole folder keeps it
          Remove-Item dist\data, dist\cache, dist\logs -Recurse -ErrorAction SilentlyContinue
          $r1 = Join-Path $env:RUNNER_TEMP "fav1.txt"; $r2 = Join-Path $env:RUNNER_TEMP "fav2.txt"
          Start-Process dist\ShugoTracker.exe -ArgumentList "--selftest-favorites", "`"$r1`"" -Wait
          Copy-Item dist -Destination moved -Recurse
          $fav = "moved\data\favorites.json"
          Start-Process moved\ShugoTracker.exe -ArgumentList "--selftest-favorites", "`"$r2`"" -Wait
          $a = Get-Content $r1 -ErrorAction SilentlyContinue; $b = Get-Content $r2 -ErrorAction SilentlyContinue
          Write-Output "::notice title=favorites::first run: $a"
          Write-Output "::notice title=favorites::second run: $b"
          "first: $a`nsecond: $b" | Set-Content ui-favorites-check.txt
          if (Test-Path $fav) { Get-Content $fav | Set-Content ui-favorites-file.txt }
          $log = "moved\logs\shugo-tracker.log"
          if (Test-Path $log) { Get-Content $log | Set-Content ui-favorites-log.txt }
          if (-not ($b -like "loaded*")) { Write-Error "favorites did not survive a restart"; exit 1 }

      - name: App log (update / api lines)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path shugo-tracker.log) {
            Get-Content shugo-tracker.log | Select-String -Pattern "update:|api:" | Select-Object -Last 8 |
              ForEach-Object { Write-Output "::notice title=applog::$_" }
          }

      - name: UI self-check
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem ui-*-check.txt) {
            $r = Get-Content $f
            Write-Output "::notice title=ui-check::$($f.Name): $r"
            if ($r -like "FAIL*") { exit 1 }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-*.png
          if-no-files-found: warn

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path ui-*)) { exit 0 }
          New-Item -ItemType Directory -Force shots | Out-Null
          Copy-Item ui-*.png shots\ -ErrorAction SilentlyContinue
          Copy-Item ui-*.txt shots\ -ErrorAction SilentlyContinue
          Set-Location shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
