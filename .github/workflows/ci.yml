# Every push: Python tests and live API checks, then the real app — the Python core plus the Electron window,
# built into one portable ShugoTracker.exe — with screenshots in demo mode (pushed to the ci-screenshots branch).
name: Tests

on:
  push:
    branches: [main, electron]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . *> tests.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content tests.txt | Select-Object -Last 40 | ForEach-Object { Write-Output "::error title=tests::$_" } }
          exit $code

      - name: Live API check (real search + details through the app's own client)
        shell: pwsh
        run: |
          python -m shugotracker.app --search-cli Luna *> live.txt
          $code = $LASTEXITCODE
          Get-Content live.txt | Select-Object -Last 9 | ForEach-Object { Write-Output "::notice title=live::$_" }
          exit $code

      - name: Loading-speed benchmark (cold vs cached)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          python -m shugotracker.app --bench Luna *> shots\bench.txt
          Get-Content shots\bench.txt | Select-Object -Last 4 | ForEach-Object { Write-Output "::notice title=bench::$_" }

      - name: Raw-socket capture sees real traffic
        shell: pwsh
        run: |
          python tools/rawsock_check.py --firewall *> rawsock.txt
          $code = $LASTEXITCODE
          Get-Content rawsock.txt | ForEach-Object { Write-Output "::notice title=rawsock::$_" }
          exit $code

      - name: Build the core (dist/shugo-core)
        run: python -m PyInstaller --noconfirm --clean ShugoCore.spec

      - name: Core answers over stdin / stdout
        shell: pwsh
        run: |
          $out = '{"id":1,"method":"init","params":{}}' + "`n" + '{"method":"quit"}' | .\dist\shugo-core\shugo-core.exe --root $env:RUNNER_TEMP\coretest --demo
          Write-Output "::notice title=core::$(($out | Select-Object -First 1).Substring(0, 120))"
          if (-not ($out -match '"result"')) { exit 1 }

      - name: Install Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.48.2

      - name: Screenshots of the real window (demo data)
        working-directory: desktop
        env:
          PYTHON: python
        run: node test/shots.js

      - name: README screenshots (demo data plus one live character)
        continue-on-error: true
        working-directory: desktop
        env:
          PYTHON: python
        run: node test/readme.js

      - name: Build ShugoTracker.exe
        working-directory: desktop
        run: npx electron-builder --win portable --publish never

      - name: Exe icon as Windows shows it, size and start-up time
        shell: pwsh
        working-directory: desktop
        run: |
          # The same app built three ways, to see what start-up costs: unpacked folder, portable (compressed), portable (stored).
          npx electron-builder --win portable --publish never -c.compression=store -c.directories.output=dist-store *> ..\shots\build-store.txt
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path dist\ShugoTracker.exe).Path
          [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save("$PWD\..\shots\exe-icon.png")
          function Time-Start($label, $src, $name) {
            foreach ($i in 1, 2) {
              $dir = Join-Path $env:RUNNER_TEMP "start-$label"
              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
              if ((Get-Item $src) -is [IO.DirectoryInfo]) { Copy-Item $src $dir -Recurse } else { New-Item -ItemType Directory $dir | Out-Null; Copy-Item $src $dir }
              Remove-Item (Join-Path $env:LOCALAPPDATA "Temp\ShugoTracker") -Recurse -Force -ErrorAction SilentlyContinue
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process (Join-Path $dir $name) -ArgumentList "--demo" -PassThru
              $log = Join-Path $dir "logs\shugo-core.log"
              while (-not (Test-Path $log) -and $sw.Elapsed.TotalSeconds -lt 60) { Start-Sleep -Milliseconds 50 }
              $t = [math]::Round($sw.Elapsed.TotalSeconds, 2)
              Write-Output "::notice title=startup::${label} run ${i}: $t s"
              "startup ${label} run ${i}: $t s" | Add-Content ..\shots\log.txt
              Get-Process | Where-Object { $_.Path -and ($_.Path -like "*ShugoTracker*" -or $_.Path -like "*shugo-core*" -or $_.Path -like "*start-*") } | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep 2
            }
          }
          Time-Start "folder" "dist\win-unpacked" "Shugo Tracker.exe"
          Time-Start "portable" "dist\ShugoTracker.exe" "ShugoTracker.exe"
          Time-Start "stored" "dist-store\ShugoTracker.exe" "ShugoTracker.exe"
          foreach ($f in "dist\ShugoTracker.exe", "dist-store\ShugoTracker.exe") {
            $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
            Write-Output "::notice title=size::$f is $mb MB"
            "size ${f}: $mb MB" | Add-Content ..\shots\log.txt
          }
          $mb = [math]::Round(((Get-ChildItem dist\win-unpacked -Recurse | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "size folder: $mb MB" | Add-Content ..\shots\log.txt

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Set-Location shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShugoTracker
          path: desktop/dist/ShugoTracker.exe
          if-no-files-found: warn
