name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Live API check (real search + details through the app's own client)
        shell: pwsh
        run: |
          python -m shugotracker.app --search-cli Luna *> live.txt
          $code = $LASTEXITCODE
          Get-Content live.txt | Select-Object -Last 9 | ForEach-Object { Write-Output "::notice title=live::$_" }
          exit $code

      - name: Loading-speed benchmark (cold vs cached)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m shugotracker.app --bench Luna *> bench.txt
          Get-Content bench.txt | Select-Object -Last 4 | ForEach-Object { Write-Output "::notice title=bench::$_" }

      - name: UI screenshots (demo data)
        run: python -m shugotracker.app --demo --query Luna --screenshot ui-demo.png

      - name: UI screenshots (live data)
        continue-on-error: true
        run: python -m shugotracker.app --query Luna --screenshot ui-live.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-*.png
          if-no-files-found: warn

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path ui-demo.png)) { exit 0 }
          New-Item -ItemType Directory -Force shots | Out-Null
          Copy-Item ui-*.png shots\
          Set-Location shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
