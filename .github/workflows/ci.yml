name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Live API check (real search + details through the app's own client)
        shell: pwsh
        run: |
          python -m shugotracker.app --search-cli Luna *> live.txt
          $code = $LASTEXITCODE
          Get-Content live.txt | Select-Object -Last 9 | ForEach-Object { Write-Output "::notice title=live::$_" }
          exit $code

      - name: UI screenshots (demo data)
        run: python -m shugotracker.app --demo --query Luna --screenshot ui-demo.png

      - name: UI screenshots (live data)
        continue-on-error: true
        run: python -m shugotracker.app --query Luna --screenshot ui-live.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-*.png
          if-no-files-found: warn
