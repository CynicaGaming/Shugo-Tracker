name: Android

# Builds the Android app (android/): the desktop app's screens and Python core, minus Nearby, as ShugoTracker.apk.
#   - on every push to main: build it, then start it in an emulator and take screenshots (artifact "android-shots")
#   - from "Publish release": build it at that version and attach ShugoTracker.apk to the release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHUGO_VERSION: ${{ inputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5          # (Chaquopy compiles the Python with the same version)
        with: { python-version: "3.12" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Stamp version
        if: inputs.version != ''
        run: echo "__version__ = \"$SHUGO_VERSION\"" > shugotracker/_version.py

      - name: Build
        run: gradle -p android assembleRelease --stacktrace

      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/ShugoTracker.apk
          (cd out && sha256sum ShugoTracker.apk > ShugoTracker.apk.sha256)
          ls -la out

      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/ }

      - name: Attach to the release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$SHUGO_VERSION" out/ShugoTracker.apk out/ShugoTracker.apk.sha256 --clobber -R "$GITHUB_REPOSITORY"

  emulator:
    if: inputs.version == ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r out/ShugoTracker.apk
            mkdir -p shots
            adb shell am start -n gg.cynica.shugotracker/.MainActivity -e q Cynica
            sleep 40
            adb exec-out screencap -p > shots/search.png
            adb shell input tap 300 600
            sleep 25
            adb exec-out screencap -p > shots/profile.png
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb exec-out screencap -p > shots/back.png
            adb logcat -d > shots/logcat.txt
            grep -E "python|chromium|Shugo|AndroidRuntime" shots/logcat.txt | tail -200 > shots/app-log.txt || true
            ! grep -q "FATAL EXCEPTION" shots/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-shots, path: shots/ }
